name: Check Python code

on:
  pull_request:
    paths:
    - 'src/**'
    - 'tests/**'
    - 'pyproject.toml'
    - 'uv.lock'
    - '.python-version'
    - '.github/workflows/check-python.yml'
  push:
    branches:
    - 'main'
    paths:
    - 'src/**'
    - 'tests/**'
    - 'pyproject.toml'
    - 'uv.lock'
    - '.python-version'
    - '.github/workflows/check-python.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Install project dependencies
      run: uv sync --locked
    - name: Run ruff check
      run: uv run --no-sync ruff check --output-format=github
    - name: Run ruff format check
      run: uv run --no-sync ruff format --check

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Install project dependencies
      run: uv sync --locked
    - name: Run mypy
      run: uv run --no-sync mypy

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Install project dependencies
      run: uv sync --locked
    - name: Run pytest
      run: uv run --no-sync pytest
