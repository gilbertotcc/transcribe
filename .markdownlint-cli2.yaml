config:
  default: true
  MD003:
    style: atx
  MD013:
    line_length: 80
    tables: false
    code_blocks: false
    headings: false
  MD014: false
  MD024:
    siblings_only: true
  MD040: false
  MD060:
    style: aligned
gitignore: true
globs:
  - "**/*.md"
ignores:
  # Vendored skills; agent prompts start with frontmatter and have no H1.
  - ".claude/skills/**"
  - ".claude/agents/**"
