config:
  default: true
  MD003:
    style: atx
  MD013:
    line_length: 80
    tables: false
    code_blocks: false
    headings: false
  MD014: false
  MD024:
    siblings_only: true
  MD040: false
  MD060:
    style: aligned
gitignore: true
globs:
  - "**/*.md"
ignores:
  # Skills installed with `skills` (see skills-lock.json).
  - ".claude/skills/caveman-commit/**"
  - ".claude/skills/cli-designer/**"
  - ".claude/skills/markdown-editor/**"
