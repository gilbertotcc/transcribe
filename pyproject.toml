[project]
name = "transcribe"
version = "0.1.0"
description = "A mostly vibe-coded audio-to-text transcriber"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Gilberto Taccari", email = "gilberto.taccari@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
transcribe = "transcribe:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-regressions>=2.8.1",
    "ruff>=0.16.6",
]

[tool.uv]
required-version = ">=0.13.5"

[tool.ruff]
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "N", # pep8-naming
    "SIM", # flake8-simplify
    "PERF", # perflint
    "RUF", # ruff-specific rules
    "S", # flake8-bandit
    "FBT", # flake8-boolean-trap
    "TC", # flake8-type-checking
    "FURB", # refurb
    "PT", # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "T20", # flake8-print
]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
    "S101", # allow `assert` in tests
    "S108", # allow hardcoded temp paths in tests
    "E501", # allow long lines in tests
    "FBT001", # allow boolean args in functions in tests
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
warn_unreachable = true
pretty = true
files = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
