[project]
name = "transcribe"
version = "0.1.0"
description = "A mostly vibe-coded audio-to-text transcriber"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Gilberto Taccari", email = "gilberto.taccari@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "click>=8.5.0",
    "faster-whisper>=1.2.1",
    "numpy>=2.5.4",
    "onnxruntime==1.23.2 ; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "sherpa-onnx>=2.0.0",
]

[project.scripts]
transcribe = "transcribe:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jiwer>=4.0.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-regressions>=2.8.1",
    "ruff>=0.16.6",
]

[tool.uv]
required-version = ">=0.13.5"

[tool.ruff]
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "N", # pep8-naming
    "SIM", # flake8-simplify
    "PERF", # perflint
    "RUF", # ruff-specific rules
    "S", # flake8-bandit
    "FBT", # flake8-boolean-trap
    "TC", # flake8-type-checking
    "FURB", # refurb
    "PT", # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "T20", # flake8-print
]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
    "S101", # allow `assert` in tests
    "S108", # allow hardcoded temp paths in tests
    "E501", # allow long lines in tests
    "FBT001", # allow boolean args in functions in tests
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
warn_unreachable = true
pretty = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Engine packages ship no type information; keep their untyped surface inside the adapters.
module = ["faster_whisper", "faster_whisper.*", "sherpa_onnx", "sherpa_onnx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib", "-m", "not engine"]
markers = ["engine: needs provisioned models (run with `pytest -m engine`)"]
xfail_strict = true
filterwarnings = ["error"]
